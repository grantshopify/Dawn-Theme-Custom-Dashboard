      <div class="prod">${thFill('navy')}<dl><div><dt>Latest order</dt><dd>#1004</dd></div><div><dt>Status</dt><dd><span class="dot"></span>In transit</dd></div><div><dt>Carrier</dt><dd class="mono">FedEx · 771234567890</dd></div><div><dt>Expected</dt><dd>Sunday, Oct 19</dd></div><div><dt>Items</dt><dd>Ski wax, Waffle towel</dd></div><div><dt>Total</dt><dd>$55.02</dd></div></dl></div>

    <div class="main in"><div class="greet">Good evening, Grant</div>

        <table><thead><tr><th>Order</th><th class="hide-m">Date</th><th>Status</th><th class="amt">Total</th></tr></thead><tbody id="tb"></tbody></table></div>
        <div class="feed">${[['Oct 18', 'Order #1006 is being prepared'], ['Oct 16', 'Order #1004 shipped with FedEx'], ['Oct 14', 'Order #1001 delivered'], ['Oct 01', '$12.50 store credit added']].map((f) => `<div><span class="mono" style="color:#888">${f[0]}</span><span>${f[1]}</span></div>`).join('')}</div></div>

  s.addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (b) { $$('[data-f]', s).forEach((x) => x.setAttribute('aria-pressed', x === b)); draw(b.dataset.f); } const r = e.target.closest('[data-t]'); if (r) toast(r.dataset.t); });

const nav = $('#nav');
nav.innerHTML = D.map((d, i) => `<button data-c="${i}" class="${d.rec ? 'rec' : ''}">${d.rec ? '' : String(i + 1).padStart(2, '0') + ' '}${d.name}</button>`).join('');
let cur = D.length - 1;
function open(i) {
  cur = i; const d = D[i];
  $$('[data-c]', nav).forEach((b) => b.setAttribute('aria-current', b.dataset.c == i));
  $('#cap').innerHTML = `<b>${d.rec ? 'Recommended combination' : String(i + 1).padStart(2, '0') + ' · ' + d.name}</b><span class="src">${d.ref[1] ? `Aligned with <a href="${d.ref[1]}" target="_blank" rel="noopener">${d.ref[0]}</a>` : d.ref[0]}</span><ul>${d.take.map((t) => `<li>${t}</li>`).join('')}</ul>`;
  const old = $('#stage'), st = old.cloneNode(false); old.replaceWith(st); d.render(st);
}
nav.addEventListener('click', (e) => { const b = e.target.closest('[data-c]'); if (b) open(+b.dataset.c); });
$('#brand').addEventListener('input', () => open(cur));
$$('[data-w]').forEach((b) => b.addEventListener('click', () => { $('#canvas').classList.toggle('mobile', b.dataset.w === 'm'); $$('[data-w]').forEach((x) => x.setAttribute('aria-pressed', x === b)); }));
open(cur);
</script>
